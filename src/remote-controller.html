<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neeko · Control</title><link rel="stylesheet" href="remote-controller.css"></head>
<body>
    <div id="bar" data-drag>
        <button id="toggle" type="button" title="Iniciar / Detener (Ctrl+Alt+F6/F9)">▶</button>
        <button id="once" type="button" title="Traducir una vez (Ctrl+Alt+F7)">1×</button>
        <button id="pause" type="button" title="Pausar / Reanudar (Ctrl+Alt+F8)">⏸</button>
        <button id="search" type="button" title="Seleccionar región (Ctrl+Alt+F6)">🔍</button>
        <button id="lock" type="button" title="Bloquear clics (Ctrl+Alt+F10)">🔓</button>
        <button id="overlay" type="button" title="Mostrar / Ocultar overlay (Ctrl+Alt+F11)">👁</button>
        <span id="status" title="Estado"></span>
    </div>
    <script src="remote-controller.js"></script>
</body>
</html>
