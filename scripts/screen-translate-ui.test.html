<!doctype html><meta charset="utf-8"><title>Screen Translate regression</title>
<link rel="stylesheet" href="../addons/screen-translate/styles.css">
<style>body{background:#2e2b43;margin:20px;width:430px;font-family:Segoe UI,sans-serif}[hidden]{display:none!important}#test-result{color:#ddd;font-size:11px}</style>
<pre id="test-result">RUNNING</pre><div id="host"></div>
<script>
(async () => {
    const assert=(condition,message)=>{if(!condition)throw new Error(message);};
    const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
    let listener,dispose;
    const calls=[];
    let state={revision:1,active:false,prepared:true,phase:'idle',message:'Listo para traducir.',profiles:[],windows:[],
        original:'',translation:'',languages:[{code:'auto',name:'Automático',engine:'oneocr',installed:true}],
        settings:{region:{x:10,y:20,width:800,height:120},source:'auto',engine:'oneocr',target:'es',inputMode:'screen',
            fontSize:20,opacity:67,intervalMs:1000,mode:'over',corrections:[],glossary:[],colorFilter:true,filterColor:'#123456',colorTolerance:23,erode:1}};
    window.Neeko={
        ui:{isSettingsWindow:true,registerSettingsTab:(_id,_name,panel)=>document.querySelector('#host').append(panel)},
        events:{on:async(_event,fn)=>{listener=fn;return()=>{};}},addon:{onUnload:fn=>dispose=fn},
        invoke:async(_command,args)=>{
            calls.push(structuredClone(args));
            if(args.action==='settings'){state.settings=args.settings;if(args.profiles)state.profiles=args.profiles;}
            if(args.action==='start'){state.active=true;state.phase='capturing';}
            if(args.action==='stop'){state.active=false;state.phase='idle';}
            state.revision++;return structuredClone(state);
        }
    };
    const script=document.createElement('script');script.src='../addons/screen-translate/main.js';
    await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=reject;document.body.append(script);});await tick();
    const $=selector=>document.querySelector(selector);
    assert(!$('.st-advanced').open,'Advanced controls must start collapsed');
    assert(!$('[data-action="start"]').closest('.st-advanced'),'Start was hidden in advanced options');
    $('[name="target"]').value='en';
    listener({payload:{...structuredClone(state),revision:++state.revision,message:'tick'}});
    assert($('[name="target"]').value==='en','Status event overwrote language draft');
    $('[data-action="start"]').click();await tick();await tick();
    assert($('[data-error]').hidden,'Start raised an error: '+$('[data-error]').textContent);
    assert(calls.slice(-2).map(call=>call.action).join(',')==='settings,start','Continuous mode never reached the backend');
    assert(state.settings.colorFilter===true && state.settings.colorTolerance===23 && state.settings.erode===1,'Hidden advanced settings were lost');
    assert(state.settings.target==='en','Destination was not saved');
    assert(!$('[data-action="stop"]').disabled && $('[name="target"]').closest('fieldset').disabled,'Running controls are unsafe');
    $('[data-action="stop"]').click();await tick();
    assert(!state.active && !$('[name="target"]').closest('fieldset').disabled,'Stop did not restore inputs');
    state.settings.region=null;state.prepared=false;state.revision++;listener({payload:structuredClone(state)});
    $('[name="inputMode"]').value='clipboard';$('[name="inputMode"]').dispatchEvent(new Event('change'));
    assert(!$('[data-action="start"]').disabled,'Clipboard incorrectly needs OCR');
    state.settings.region={x:10,y:20,width:800,height:120};state.prepared=true;state.settings.inputMode='screen';state.revision++;listener({payload:structuredClone(state)});
    $('#test-result').textContent='PASS: continuous start, hidden settings, simple layout, draft preservation, stop, clipboard';
})().catch(error=>document.querySelector('#test-result').textContent='FAIL: '+error.stack);
</script>
