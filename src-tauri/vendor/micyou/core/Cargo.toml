[package]
name = "neeko-micyou-core"
version = "2.0.3"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
micyou-protocol = { path = "../micyou-protocol" }
micyou-audio = { path = "../micyou-audio", features = ["dsp", "noise-suppression"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
log = "0.4"
bytes = "1"
prost = "0.14.3"
opus-decoder = "0.1.1"
mdns-sd = "0.20"
hostname = "0.4"
local-ip-address = "0.6"
socket2 = "0.6"

[dev-dependencies]
cpal = "0.15.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winsock2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
