[workspace]
resolver = "2"
members = ["vendor/micyou/core", "vendor/micyou/micyou-audio", "vendor/micyou/micyou-protocol"]

[package]
name = "neeko-assistant"
version = "1.0.5"
edition = "2021"

[dependencies]
neeko-micyou-core = { path = "vendor/micyou/core" }
micyou-audio = { path = "vendor/micyou/micyou-audio", features = ["dsp", "noise-suppression"] }
micyou-protocol = { path = "vendor/micyou/micyou-protocol" }
cpal = "0.15.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
lnk = "0.6"
open = "5"
axum = { version = "0.8", features = ["multipart"] }
tauri-plugin-dialog = "2"
tower-http = { version = "0.6", features = ["cors", "fs"] }
futures-util = "0.3"
mime_guess = "2"
regex = "1"
urlencoding = "2"
tauri-plugin-drpc = "0.1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "neeko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Same decoder fix as the reviewed MicYou revision, pinned instead of a moving branch.
[patch.crates-io]
opus-decoder = { git = "https://github.com/tfr0305/Rusopus.git", rev = "025a8e4e77fa544b66c4ad90cf49efe684a45faf" }
